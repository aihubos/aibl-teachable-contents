<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI빌더스랩 · 교육 콘텐츠 워크플로</title>
  <meta name="description" content="학생·일반인·시니어, 입문부터 고급까지. 노드를 눌러 AI빌더스랩 교육 콘텐츠를 찾아보세요.">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="fonts/pretendard.css">
  <link rel="stylesheet" href="flow.css">
  <script>try{var t=new URLSearchParams(location.search).get("style")||localStorage.getItem("aibl-style");if(t)document.documentElement.dataset.pre=t}catch(e){}</script>
  <script src="data.js" defer></script>
  <script src="flow.js" defer></script>
</head>
<body data-theme="n8n">
  <header class="bar">
    <div class="bar-l"><img src="brand-wordmark.png" alt="AI빌더스랩" width="132" height="32"><span class="crumb" id="crumb">교육 콘텐츠 워크플로</span></div>
    <div class="bar-r"><button type="button" class="btn ghost" id="reset">처음부터</button><a class="btn" href="list.html">전체 목록</a></div>
  </header>
  <main class="canvas" id="canvas">
    <p class="hint" id="hint">노드를 눌러 다음 단계를 열어 보세요 · 1차시 = 수업 50분 + 휴식 10분</p>
    <div class="flow" id="flow">
      <svg class="edges" id="edges" aria-hidden="true"></svg>
      <section class="col" id="col-start" aria-label="시작"></section>
      <section class="col" id="col-aud" aria-label="대상"></section>
      <section class="col" id="col-level" aria-label="수준" hidden></section>
      <section class="col col-items" id="col-items" aria-label="콘텐츠" hidden></section>
    </div>
  </main>
  <aside class="panel" id="panel" aria-label="콘텐츠 상세" aria-hidden="true">
    <div class="panel-in" id="panel-in"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <nav class="dock" id="dock" aria-label="화면 스타일"><span class="dock-l">스타일</span></nav>
  <div id="live" class="sr" role="status" aria-live="polite"></div>
</body>
</html>
